<!DOCTYPE html>
<!--
  DUSUR — ADMIN site (private). One file, no backend, ready for GitHub Pages.

  KEEP THE ADDRESS OF THIS FILE PRIVATE.
  - It is a different file from the client site: clients only ever use index.html and the links you copy from the dashboard.
  - Nothing links to this page and search engines are told to skip it. Keep the long random file name it was delivered with.
  - Anyone who finds the address still faces the admin password; the token and the data keys live only in your own browsers.

  SETUP
  1. Put index.html (client site) and this file in the root of a PUBLIC GitHub repository and enable GitHub Pages.
     (Public is required: clients read their encrypted files from raw.githubusercontent.com.)
  2. Create a fine-grained Personal Access Token limited to that one repository, with "Contents: Read and write".
  3. Open this page, fill in Configuration (first-time setup), then use Settings to add your company details.
  4. On another device: open this page, choose "Import connection code" on the setup screen
     (create the code on the first device under Configuration > Use on another device).

  WHAT LIVES IN THE REPOSITORY
    data/clients/<id>.json        client-facing snapshot, AES-256 under the client's secret key
    data/clients/<id>/<photo>.t|f encrypted photo thumbnail / full image (AES-256-GCM, client key)
    data/private/<id>.json        full record incl. costs, BOM and profit, AES-256-GCM under the admin master key
    data/private/settings.json    settings, counters (admin master key)
    data/private/vault.json       the master key, wrapped by your admin password
    data/public/brand.json        company name, contacts and logo shown on the client site (public on purpose)
    data/public/index.json        one-way hashes of project SKUs for the client site's live search

  Nothing secret or repository-specific is hard-coded in this file.
-->

<script>
(function(){var d=document.documentElement;try{
var l=localStorage.getItem('dsp.lang');if(l!=='ar'&&l!=='en')l=((navigator.language||'en').slice(0,2)==='ar')?'ar':'en';
var th=localStorage.getItem('dsp.theme');if(th!=='light'&&th!=='dark')th='dark';
d.lang=l;d.dir=l==='ar'?'rtl':'ltr';d.setAttribute('data-theme',th);}catch(e){}
if(location.hash.indexOf('#client/')===0)d.classList.add('client-mode');})();

/* Start-up safety net (plain ES5 so it works everywhere):
   - records script errors, and if the app never starts shows WHY instead of an empty page
   - loads CryptoJS without blocking the page, trying cdnjs, then jsDelivr, then unpkg */
(function(){
var D=window.__dsp={errs:[],booted:false,crypto:null};
function rec(m){if(D.errs.length<8)D.errs.push(String(m).slice(0,300));}
window.addEventListener('error',function(e){
  var t=e&&e.target;
  if(t&&t!==window&&(t.src||t.href)){rec('could not load '+(t.src||t.href));return;}
  rec((e&&e.message||'script error')+(e&&e.filename?' ('+e.lineno+':'+e.colno+')':''));
},true);
window.addEventListener('unhandledrejection',function(e){rec('promise: '+(e.reason&&e.reason.message||e.reason));});

var SRC=['https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js','https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js','https://unpkg.com/crypto-js@4.2.0/crypto-js.js'];
D.crypto=new Promise(function(res){
  var i=0;
  (function next(){
    if(window.CryptoJS)return res(true);
    if(i>=SRC.length)return res(false);
    var s=document.createElement('script'),done=false,tm=0,url=SRC[i];
    function fin(){if(done)return;done=true;clearTimeout(tm);if(window.CryptoJS)res(true);else{i++;next();}}
    s.onload=fin;s.onerror=fin;tm=setTimeout(fin,9000);
    s.async=true;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';s.src=url;
    document.head.appendChild(s);
  })();
});

function diag(){
  if(D.booted)return;
  var m=document.getElementById('app');if(!m||m.getAttribute('data-diag'))return;
  m.setAttribute('data-diag','1');m.textContent='';
  function el(tag,txt,st){var x=document.createElement(tag);if(txt)x.textContent=txt;if(st)x.style.cssText=st;m.firstChild?m.firstChild.appendChild(x):m.appendChild(x);return x;}
  var c=document.createElement('section');c.className='card state';m.appendChild(c);
  el('h1','The portal could not start — تعذّر تشغيل البوابة');
  el('p','The page loaded but its script did not run. Open this page directly in Chrome from its https:// GitHub Pages address (not inside a file viewer, preview or in-app browser) and reload. If it still fails, send a screenshot of this box.','color:var(--muted)');
  var info=[D.errs.length?D.errs.join('\n'):'(no script error was reported — scripts are probably blocked by the viewer)',
    'page: '+location.protocol+'//'+location.host,'secure context: '+(window.isSecureContext?'yes':'no'),'crypto.subtle: '+(window.crypto&&crypto.subtle?'yes':'no'),'CryptoJS: '+(window.CryptoJS?'yes':'no'),'browser: '+(navigator.userAgent||'').slice(0,140)].join('\n');
  el('pre',info,'white-space:pre-wrap;word-break:break-word;text-align:left;direction:ltr;font-size:12px;max-width:100%;overflow:auto;margin:0;padding:10px;border:1px solid var(--line);border-radius:8px');
}
document.addEventListener('DOMContentLoaded',function(){setTimeout(diag,2500);});
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">

<meta name="color-scheme" content="dark light">
<title>DUSUR — Admin</title>

<style>
:root,[data-theme=dark]{
  --bg:#0f172a;--bg-2:#0b1224;--card:#1e293b;--card-2:#17233a;--line:#334155;--line-2:#475569;
  --text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent-2:#2563eb;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--input:#0f172a;--glow:#1b2a4e;
  --shadow:0 10px 30px rgba(2,6,23,.35);--radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=light]{
  --bg:#f1f5f9;--bg-2:#e2e8f0;--card:#ffffff;--card-2:#f8fafc;--line:#cbd5e1;--line-2:#94a3b8;
  --text:#0f172a;--muted:#475569;--accent:#0369a1;--accent-2:#2563eb;
  --ok:#15803d;--warn:#b45309;--bad:#b91c1c;--input:#ffffff;--glow:#dbeafe;
  --shadow:0 6px 20px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100vh;color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  background:radial-gradient(1100px 520px at 85% -10%,var(--glow) 0%,transparent 62%),var(--bg)}
h1,h2,h3{margin:0;line-height:1.3}
h1{font-size:clamp(22px,3vw,30px)} h2{font-size:18px} h3{font-size:16px}
p{margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--mono)}
.mono,.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)} .small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:10px clamp(16px,4vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#06142e;background:linear-gradient(135deg,#38bdf8,#2563eb)}
.topbar nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.topbar nav a{color:var(--muted);text-decoration:none;padding:7px 12px;border-radius:10px;font-weight:600}
.topbar nav a:hover{color:var(--text);background:var(--card)}
.topbar nav a[aria-current=page]{color:var(--text);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.client-only{display:none}
html.client-mode .client-only{display:inline-flex}
html.client-mode .admin-only{display:none!important}
.secure-banner{align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}

main{max-width:1120px;margin:0 auto;padding:clamp(16px,3vw,32px);display:block}
.stack{display:grid;gap:20px} .stack-sm{display:grid;gap:12px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.back{display:inline-block;margin-bottom:6px;color:var(--muted);text-decoration:none;font-weight:600}
.back:hover{color:var(--text)}

/* cards, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(14px,2.5vw,24px);box-shadow:var(--shadow);min-width:0}
.card>.stack-sm,.card>.stack{min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
form.card{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--muted)}
input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;min-width:0}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea{resize:vertical;min-height:84px}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent-2)}
input[type=file]{padding:7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.input-row{display:flex;gap:8px}.input-row input{flex:1;min-width:0}
.hint{font-size:12.5px;font-weight:400;color:var(--muted)}
.notice{font-size:13.5px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:10px;padding:10px 12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sep{height:1px;background:var(--line);margin:4px 0}

.btn,button{font:inherit;font-weight:700;cursor:pointer;color:var(--text);background:var(--card-2);border:1px solid var(--line);border-radius:10px;
  padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover,button:hover{border-color:var(--line-2);filter:brightness(1.06)}
.btn.primary,button.primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:#3b82f6;color:#fff}
.btn.small,button.small{padding:5px 11px;font-size:13px}
.btn.ghost,button.ghost{background:transparent}
.btn.danger,button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.msg{font-size:13.5px;border-radius:10px;padding:10px 12px;border:1px solid var(--line);background:var(--card-2);display:grid;gap:6px}
.msg.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.msg.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.msg.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.link{display:block;font-family:var(--mono);font-size:12.5px;color:var(--accent);word-break:break-all;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px 10px;direction:ltr;text-align:left}
.empty{padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* badges & pills */
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge.enc{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.badge.pending{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted);border-color:var(--line-2)}
.badge.progress{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.badge.done{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.badge.late{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.ico{display:inline-flex;vertical-align:middle;flex:none}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--card);padding:12px 16px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
.kpi.pos .v{color:var(--ok)} .kpi.neg .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}.kpi{padding:11px 12px}.kpi .v{font-size:clamp(15px,4.4vw,20px)}}
.list{display:grid;gap:12px}
.item{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card-2)}
.item-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item-top .badge{margin-inline-start:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;padding:3px 9px;border-radius:8px;font-size:12.5px;background:var(--bg-2);border:1px solid var(--line)}

/* project tabs & editor */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.addrow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,2fr) auto;gap:8px;align-items:end}
@media (max-width:640px){.addrow{grid-template-columns:1fr}}
.rg{display:grid;gap:8px;align-items:center;grid-template-columns:var(--cols,1fr)}
@media (max-width:700px){.rg{grid-template-columns:1fr 1fr}.rg>.wide{grid-column:1/-1}}
.editor-stage{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card-2);display:grid;gap:10px}
.editor-stage .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.editor-stage select{width:auto}
.check{display:flex;gap:10px;align-items:center;font-weight:500;font-size:14px;color:var(--text)}
.check span{flex:1;min-width:0;overflow-wrap:anywhere}
.x{padding:2px 8px;font-size:14px;line-height:1.2}
.savebar{position:sticky;bottom:0;z-index:15;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:12px 16px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.private{border-inline-start:3px solid var(--warn)}
.secretrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* progress */
.bar{height:10px;border-radius:99px;background:var(--input);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .6s ease}
.bar.ok i{background:linear-gradient(90deg,#16a34a,var(--ok))}
.mini{height:6px}

/* client portal */
.hero{display:grid;gap:16px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;color:var(--accent);font-weight:700;margin-bottom:4px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0}
.meta div{background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.meta dt{font-size:12px;color:var(--muted);font-weight:600}
.meta dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.desc{color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;opacity:.9}
.pcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pcard{text-align:start;display:grid;gap:6px;padding:12px;align-items:start;justify-content:stretch}
.pcard[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:12px;align-content:start;border-top:3px solid var(--line-2)}
.stage.progress{border-top-color:var(--warn)} .stage.done{border-top-color:var(--ok)}
.stage header{display:flex;align-items:center;gap:10px}
.stage header .badge{margin-inline-start:auto}
.step{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--input);border:1px solid var(--line);flex:none}
.stage.done .step{color:var(--ok);border-color:var(--ok)} .stage.progress .step{color:var(--warn);border-color:var(--warn)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{display:flex;gap:9px;align-items:flex-start;opacity:.85}
.checks li .ico{margin-top:4px;color:var(--line-2)}
.checks li.done{opacity:1}.checks li.done .ico{color:var(--ok)}
.parts{display:grid;gap:8px}
.part{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card-2)}
.part .nm{overflow-wrap:anywhere;font-weight:600}
@media (max-width:560px){.part{grid-template-columns:1fr auto}.part .when{grid-column:1/-1}}
.pay{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pay:last-child{border-bottom:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.state{max-width:520px;margin:8vh auto 0;text-align:center;display:grid;gap:14px;justify-items:center}
.state .actions{justify-content:center}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate{max-width:380px;margin:8vh auto 0;text-align:center}
.gate-icon{width:52px;height:52px;margin:0 auto;border-radius:14px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.gate-icon .ico svg{width:24px;height:24px}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card-2);display:grid;align-content:start;min-width:0}
.ph .imgbtn{padding:0;border:0;border-radius:0;background:var(--bg-2);aspect-ratio:4/3;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{padding:6px 8px;font-size:12.5px;overflow-wrap:anywhere}
.ph .cap small{display:block;color:var(--muted)}
.ph-fail{display:grid;place-items:center;gap:4px;color:var(--muted);font-size:12px;padding:20px 8px;text-align:center}
.ph .ctl{display:grid;gap:6px;padding:6px}
dialog{color:var(--text)}
dialog.dlg,dialog.lb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;width:min(720px,94vw);max-height:92vh}
dialog.lb{width:min(1000px,96vw)}
dialog::backdrop{background:rgba(2,6,23,.75)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.dlg-body{padding:18px;overflow:auto;max-height:calc(92vh - 60px);display:grid;gap:12px}
.lb img{max-width:100%;max-height:68vh;object-fit:contain;display:block;margin:0 auto;border-radius:8px}
.lb-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}

.toasts{position:fixed;inset-inline:0;bottom:16px;display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);max-width:90vw}
.toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)}

/* tape-measure countdown: the one signature element */
.tape-wrap{display:grid;gap:8px}
.tape-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.tape-big{font-size:clamp(24px,4.4vw,36px);font-weight:800;line-height:1.15;letter-spacing:-.01em}
.tape{--tape:#f5c542;position:relative;height:40px;border-radius:6px;overflow:hidden;background-color:var(--tape);
  background-image:repeating-linear-gradient(to right,#1c1917 0 1.5px,transparent 1.5px 8px),repeating-linear-gradient(to right,#1c1917 0 2px,transparent 2px 40px);
  background-size:100% 30%,100% 56%;background-repeat:no-repeat;background-position:0 100%,0 100%;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 1px 0 var(--line)}
[dir=rtl] .tape{background-image:repeating-linear-gradient(to left,#1c1917 0 1.5px,transparent 1.5px 8px),repeating-linear-gradient(to left,#1c1917 0 2px,transparent 2px 40px);background-position:100% 100%,100% 100%}
.tape.late{--tape:#f87171}
.tape.done{--tape:#4ade80}
.tape-used{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--bg) 66%,transparent);transition:width .8s ease}
.tape-now{position:absolute;inset-block:0;width:3px;margin-inline-start:-1.5px;background:var(--text);box-shadow:0 0 0 2px var(--tape)}
.tape-ends{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted)}

/* misc */
.bi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.bi{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end}
details.card>summary{cursor:pointer;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.card[open]>summary{margin-bottom:12px}
.titleblock{display:grid;gap:6px}
.titleblock h2{font-size:clamp(20px,3vw,26px)}
.rowsep{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar.thin{height:8px}
.up{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .imgbtn:hover{filter:none;border:0}
input[readonly]{opacity:.8}
.pay .amt{font-weight:700;font-variant-numeric:tabular-nums}
.pay .who{display:grid;gap:2px;min-width:0}
/* shown by pure CSS after 8s, so it appears even if every script is blocked; the app replaces it once it starts */
.slowhint{opacity:0;animation:slowfade .6s 8s forwards}
@keyframes slowfade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}

async function deriveVaultKey(password, salt) {

  return { iv: bytesToB64(iv), ct: bytesToB64(ct) };

async function makeVariants(file) {

    const w = Math.max(1, Math.round(bmp.width * sc)), hh = Math.max(1, Math.round(bmp.height * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = hh;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh); ctx.drawImage(bmp, 0, 0, w, hh);
    const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', q));

// Rating pipeline: the client's rating travels as an encrypted code, readable only with that client's secret key.
const FB_PREFIX = 'DSFB1.';
const b64url = (b) => b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = (s) => { s = String(s).replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return s; };
async function makeFeedbackCode(fb, secret, id) {
  const body = { v: 1, id, sku: fb.sku, score: fb.score, comment: fb.comment, at: new Date().toISOString() };
  const cipher = CryptoJS.AES.encrypt(JSON.stringify(body), await clientPassphrase(secret, id)).toString();
  return FB_PREFIX + id + '.' + b64url(cipher);
}
async function readFeedbackCode(code, secret) {
  const m = /^DSFB1\.([A-Za-z0-9_-]{3,40})\.([A-Za-z0-9_-]+)$/.exec(String(code).trim());
  if (!m) return null;
  try {
    const o = JSON.parse(CryptoJS.AES.decrypt(unb64url(m[2]), await clientPassphrase(secret, m[1])).toString(CryptoJS.enc.Utf8));
    return o && o.v === 1 && o.id === m[1] && Number.isInteger(o.score) && o.score >= 1 && o.score <= 10 ? o : null;
  } catch (_) { return null; }
}

function stageEditor(stages, mode, onChange) {

    user: h('input', { id: 'cfgUser', required: true, maxlength: 39, spellcheck: 'false', autocapitalize: 'off', placeholder: 'octocat', dir: 'ltr', readonly: !!cfg }),

  };

  const msg = msgBox();
  const btnSave = h('button', { class: 'btn primary', type: 'submit', id: 'btnSaveCfg' }, t('cfg.save'));
  const btnTest = h('button', { class: 'btn', type: 'button', id: 'btnTest', onclick: onTest }, t('cfg.test'));
  const btnWipe = h('button', { class: 'btn danger', type: 'button', id: 'btnWipe', onclick: wipeConfig, hidden: !cfg }, t('cfg.reset'));

  async function onTest() {
    const user = f.user.value.trim(), repo = f.repo.value.trim(), pat = f.pat.value.trim() || (session && session.pat);
    if (!user || !repo || !pat) return setMsg(msg, 'bad', t('cfg.fillFirst'));
    setMsg(msg, '', t('cfg.testing'));
    try {
      const r = await gh(repoBase(user, repo), { pat });
      const lines = [t('cfg.connected', { repo: r.full_name })]; let kind = 'ok';
      if (r.private) { kind = 'warn'; lines.push(t('cfg.private')); }
      if (r.permissions && r.permissions.push === false) { kind = 'bad'; lines.push(t('cfg.noPush')); }
      try { await gh(repoBase(user, repo) + '/contents/data/private/vault.json', { pat }); lines.push(t('cfg.vaultFound')); } catch (e) { if (e.status === 404) lines.push(t('cfg.vaultNew')); }
      lines.push(t('cfg.writeNote'));
      setMsg(msg, kind, ...lines);
    } catch (e) { setMsg(msg, 'bad', e.message); }
  }

  async function onSave(e) {
    e.preventDefault();
    const user = f.user.value.trim(), repo = f.repo.value.trim(), pat = f.pat.value.trim(), pw = f.pw.value, pw2 = f.pw2.value;
    if (!/^[A-Za-z0-9-]{1,39}$/.test(user)) return setMsg(msg, 'bad', t('cfg.badUser'));
    if (!/^[A-Za-z0-9._-]{1,100}$/.test(repo)) return setMsg(msg, 'bad', t('cfg.badRepo'));
    if (!cfg && (!pat || !pw)) return setMsg(msg, 'bad', t('cfg.needBoth'));
    if (pw && pw.length < MIN_ADMIN_PW) return setMsg(msg, 'bad', t('cfg.pwShort', { n: MIN_ADMIN_PW }));
    if (pw && pw !== pw2) return setMsg(msg, 'bad', t('cfg.pwMismatch'));
    btnSave.disabled = true; btnSave.textContent = t('cfg.saving'); setMsg(msg, '', t('cfg.checking'));
    const prevRaw = ls.get(LS_CFG), prevSession = session, prevMasterP = masterP;
    try {
      const patPlain = pat || (session && session.pat);
      let salt, key;
      if (pw || !cfg) { salt = rand(16); key = await deriveVaultKey(pw, salt); } else { salt = b64ToBytes(cfg.salt); key = session.key; }
      const sealed = await vaultSeal(key, patPlain);
      try { localStorage.setItem(LS_CFG, JSON.stringify({ user, repo, salt: bytesToB64(salt), iv: sealed.iv, ct: sealed.ct })); } catch (_) { throw new Error(t('cfg.storage')); }
      // Work with the NEW token but the OLD password until the vault is open: the vault in the repo is still wrapped with the old one.
      session = { key: cfg ? prevSession.key : key, pat: patPlain, pw: cfg ? prevSession.pw : pw, master: (prevSession && prevSession.master) || null, settings: (prevSession && prevSession.settings) || null };
      masterP = null;
      const master = await needMaster();                       // creates or opens data/private/vault.json: first real write to the repository
      if (cfg && pw) await putFile('data/private/vault.json', JSON.stringify(await wrapMaster(pw, master.raw)), 'Update vault');
      await loadSettings(); await saveSettings();             // proves the token can write
      await publishBrand();                                    // public company profile for the client site
      session.key = key; session.pw = null;
      armIdle(); toast(t('cfg.saved'), 'ok');
      if (location.hash === '#dashboard') route(); else location.hash = '#dashboard';
    } catch (err) {
      if (prevRaw === null) { try { localStorage.removeItem(LS_CFG); } catch (_) { /* ignore */ } } else ls.set(LS_CFG, prevRaw);
      session = prevSession; masterP = prevMasterP;
      setMsg(msg, 'bad', t('cfg.failed'), err.message);
    } finally { btnSave.disabled = false; btnSave.textContent = t('cfg.save'); }
  }

  mount(h('section', { class: 'stack' },
    h('div', { class: 'page-head' }, h('h1', {}, t('nav.config')), encBadge()),
    h('form', { class: 'card', autocomplete: 'off', novalidate: true, onsubmit: onSave },
      h('p', { class: 'notice' }, cfg ? t('cfg.noticeEdit') : t('cfg.noticeNew')),
      h('div', { class: 'grid2' }, fld('cfg.user', f.user), fld('cfg.repo', f.repo)),
      cfg ? h('p', { class: 'hint' }, t('cfg.repoLocked')) : null,
      fld('cfg.pat', f.pat, 'cfg.patHint'),
      h('div', { class: 'grid2' }, fld('cfg.pw', f.pw), fld('cfg.pw2', f.pw2)),
      h('p', { class: 'hint' }, t('cfg.pwHint', { n: MIN_ADMIN_PW })),
      h('p', { class: 'hint' }, t('cfg.publicHint')),
      h('div', { class: 'actions' }, btnSave, btnTest, btnWipe), msg),
    ...(cfg ? [thisPageCard(), connCard()] : [importCard()])));
}

async function logoFromFile(file) {
  if (file.size > 12 * 1024 * 1024) throw new Error(t('set.logoBig'));
  let bmp; try { bmp = await createImageBitmap(file); } catch (_) { throw new Error(t('ph.unsupported', { name: file.name })); }
  try {
    for (const max of [420, 320, 240, 160]) {
      const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * sc)); c.height = Math.max(1, Math.round(bmp.height * sc));
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/png');
      if (url.length < 150000) return url;
    }
  } finally { if (bmp.close) bmp.close(); }
  throw new Error(t('set.logoBig'));
}

  await pool(files, 5, async (f) => {
    const id = f.name.slice(0, -5);
    try { items.push(await loadPrivate(id)); } catch (e) { bad.push({ id, msg: e.message }); }

  store = { settings, items, bad, q: '' };

async function saveEditor(quiet) {
  if (!ed || ed.saving) return;
  const rec = ed.rec, wasNew = ed.isNew;
  cleanRec(rec);
  const bad = validateRec(rec); if (bad) { toast(bad, 'bad'); return; }
  ed.saving = true; syncSaveBar();

    await needMaster();
    if (!ed.isNew && rec.secret !== ed.origSecret && hasFilePhotos(rec)) await rekeyPhotos(rec, ed.origSecret);
    rec.updatedAt = new Date().toISOString();
    if (ed.isNew) {
      for (let a = 0; ; a++) {
        try { ed.sha = await savePrivate(rec, null); break; } catch (e) { if (e.status === 422 && a < 5 && !hasFilePhotos(rec)) { rec.id = nextClientId(); continue; } throw e; }
      }
      ed.isNew = false; ed.id = rec.id;
    } else ed.sha = await savePrivate(rec, ed.sha);
    const entry = { rec: clone(rec), sha: ed.sha };
    const k = store.items.findIndex((x) => x.rec.id === rec.id);
    if (k >= 0) store.items[k] = entry; else store.items.unshift(entry);
    await publishClient(rec);                                  // if this fails the private copy is saved and the client still sees the old version
    if (ed.seqBump) { await saveSettings(); ed.seqBump = false; }
    for (const path of ed.trash.splice(0)) { try { await delFile(path); } catch (_) { /* best effort */ } }
    ed.origSecret = rec.secret; ed.dirty = false; ed.savedAt = new Date().toISOString();

}

/* =====================================================================
   BOM (bill of materials) per project
   ===================================================================== */
const BOM_CATS = ['board', 'edge', 'hardware', 'finish', 'glass', 'accessory', 'other'];
const BOM_UNITS = ['pcs', 'sheet', 'm', 'm2', 'kg', 'l', 'set'];
const BOM_TO_COST = { board: 'materials', edge: 'materials', finish: 'materials', glass: 'materials', hardware: 'hardware', accessory: 'hardware', other: 'other' };
const bomTotal = (x) => num(x.qty) * num(x.cost);
const bomSum = (p) => sum(p.bom || [], bomTotal);
function bomByCat(p) { const m = new Map(); for (const x of p.bom || []) m.set(x.cat || 'other', (m.get(x.cat || 'other') || 0) + bomTotal(x)); return m; }

// records saved by an older version may lack the newer fields
function normalizeRec(rec) {
  for (const p of rec.projects || []) {
    p.costs = p.costs || []; p.bom = p.bom || []; p.parts = p.parts || []; p.payments = p.payments || []; p.photos = p.photos || []; p.stages = p.stages || [];
    if (p.feedback === undefined) p.feedback = null;
  }
  return rec;
}

// One COGS line per category, replacing earlier lines created from the BOM (marked src: 'bom'); lines typed by hand are untouched.
function syncBomToCosts(p) {
  p.costs = (p.costs || []).filter((c) => c.src !== 'bom');
  const byCost = new Map();
  for (const [cat, amt] of bomByCat(p)) { const k = BOM_TO_COST[cat] || 'other'; byCost.set(k, (byCost.get(k) || 0) + amt); }
  for (const [k, amt] of byCost) if (amt > 0) p.costs.push({ type: 'cogs', cat: k, note: t('bom.costNote'), amount: Math.round(amt * 100) / 100, src: 'bom' });
}

  const row = (x, i) => {
    const tot = h('span', { class: 'bomtot' }); const upd = () => { tot.textContent = money(bomTotal(x)); }; upd();
    return h('div', { class: 'rg bomrow', style: '--cols:minmax(0,2fr) minmax(0,1fr) 78px minmax(0,1fr) minmax(0,1fr) minmax(132px,1.4fr) minmax(0,1.1fr) auto' },
      h('div', { class: 'wide' }, tin(x, 'name', { ph: t('bom.name'), max: 120 })),
      tin(x, 'code', { ph: t('bom.code'), max: 30, dir: 'ltr' }),

function fmtCell(v, kind, plain) {

  switch (kind) {
    case 'money': return plain ? nf(v, { minimumFractionDigits: 0, maximumFractionDigits: 2 }) : money(v);
    case 'pct': return pct(v);
    case 'int': return nf(v);

  put(r, c, v, s) { this.cells.set(r + ',' + c, { r, c, v, s: s || 0 }); }
  xml(rtl, first, footerText) {
    const rows = new Map();
    for (const cell of this.cells.values()) { if (!rows.has(cell.r)) rows.set(cell.r, []); rows.get(cell.r).push(cell); }
    const cellXml = ({ r, c, v, s }) => {
      const ref = colName(c) + (r + 1), st = s ? ' s="' + s + '"' : '';
      if (v === '' || v == null || (typeof v === 'number' && !isFinite(v))) return s ? '<c r="' + ref + '"' + st + '/>' : '';
      if (typeof v === 'number') return '<c r="' + ref + '"' + st + '><v>' + v + '</v></c>';
      return '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' + xe(v) + '</t></is></c>';
    };
    const data = [...rows.keys()].sort((a, b) => a - b).map((r) => { const ht = this.heights.get(r); return '<row r="' + (r + 1) + '"' + (ht ? ' ht="' + ht + '" customHeight="1"' : '') + '>' + rows.get(r).sort((a, b) => a.c - b.c).map(cellXml).join('') + '</row>'; }).join('');
    const view = '<sheetViews><sheetView workbookViewId="0"' + (rtl ? ' rightToLeft="1"' : '') + (this.grid ? '' : ' showGridLines="0"') + (first ? ' tabSelected="1"' : '') + '>'
      + (this.freeze ? '<pane ySplit="' + this.freeze + '" topLeftCell="A' + (this.freeze + 1) + '" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A' + (this.freeze + 1) + '" sqref="A' + (this.freeze + 1) + '"/>' : '') + '</sheetView></sheetViews>';
    const cols = this.widths.length ? '<cols>' + this.widths.map((w, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>').join('') + '</cols>' : '';
    const hf = '<headerFooter><oddFooter>' + xe(footerText) + '</oddFooter></headerFooter>';
    return XML + '<worksheet xmlns="' + NS_MAIN + '" xmlns:r="' + NS_R + '"><sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' + view + '<sheetFormatPr defaultRowHeight="15"/>' + cols
      + '<sheetData>' + data + '</sheetData>' + (this.merges.length ? '<mergeCells count="' + this.merges.length + '">' + this.merges.map((m) => '<mergeCell ref="' + m + '"/>').join('') + '</mergeCells>' : '')
      + '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.7" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="landscape" fitToWidth="1" fitToHeight="0"/>' + hf
      + (this.drawing ? '<drawing r:id="rId1"/>' : '') + '</worksheet>';
  }
}

/* ---- charts ---- */
const CHART_FMT = { money: '#,##0', pct: '0%', int: '0', score: '0.0' };
const qSheet = (n) => "'" + String(n).replace(/'/g, "''") + "'";
function chartXml(c, ref) {
  const fc = CHART_FMT[c.fmt] || 'General', n = c.cats.length, many = n > 12;
  const strCache = (arr) => '<c:strCache><c:ptCount val="' + arr.length + '"/>' + arr.map((v, i) => '<c:pt idx="' + i + '"><c:v>' + xe(v) + '</c:v></c:pt>').join('') + '</c:strCache>';
  const numCache = (arr) => '<c:numCache><c:formatCode>' + xe(fc) + '</c:formatCode><c:ptCount val="' + arr.length + '"/>' + arr.map((v, i) => '<c:pt idx="' + i + '"><c:v>' + v + '</c:v></c:pt>').join('') + '</c:numCache>';
  const fill = (col) => '<a:solidFill><a:srgbClr val="' + xhex(col) + '"/></a:solidFill>';
  const dl = (pctMode) => '<c:dLbls><c:numFmt formatCode="' + (pctMode ? '0%' : xe(fc)) + '" sourceLinked="0"/><c:spPr><a:noFill/><a:ln><a:noFill/></a:ln></c:spPr><c:txPr><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="900"/></a:pPr><a:endParaRPr lang="en-US"/></a:p></c:txPr><c:showLegendKey val="0"/><c:showVal val="' + (pctMode ? 0 : 1) + '"/><c:showCatName val="0"/><c:showSerName val="0"/><c:showPercent val="' + (pctMode ? 1 : 0) + '"/><c:showBubbleSize val="0"/></c:dLbls>';
  const cat = '<c:cat><c:strRef><c:f>' + xe(ref.cat) + '</c:f>' + strCache(c.cats) + '</c:strRef></c:cat>';
  const ser = (s, i) => {
    const tx = '<c:tx><c:strRef><c:f>' + xe(ref.name[i]) + '</c:f>' + strCache([s.name]) + '</c:strRef></c:tx>';
    const val = '<c:val><c:numRef><c:f>' + xe(ref.val[i]) + '</c:f>' + numCache(s.values) + '</c:numRef></c:val>';
    const head = '<c:idx val="' + i + '"/><c:order val="' + i + '"/>' + tx;
    if (c.kind === 'donut') return '<c:ser>' + head + c.cats.map((_, k) => '<c:dPt><c:idx val="' + k + '"/><c:bubble3D val="0"/><c:spPr>' + fill(catColor(c, k)) + '<a:ln w="19050"><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill></a:ln></c:spPr></c:dPt>').join('') + dl(true) + cat + val + '</c:ser>';
    if (c.kind === 'line') return '<c:ser>' + head + '<c:spPr><a:ln w="31750" cap="rnd">' + fill(s.color) + '<a:round/></a:ln></c:spPr><c:marker><c:symbol val="circle"/><c:size val="7"/><c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln w="22225">' + fill(s.color) + '</a:ln></c:spPr></c:marker>' + (many ? '' : dl(false)) + cat + val + '<c:smooth val="0"/></c:ser>';
    return '<c:ser>' + head + '<c:spPr>' + fill(s.color) + '</c:spPr><c:invertIfNegative val="0"/>' + (many ? '' : dl(false)) + cat + val + '</c:ser>';
  };
  const sers = c.series.map(ser).join('');
  const hb = c.kind === 'hbar';
  const axes = '<c:catAx><c:axId val="5001"/><c:scaling><c:orientation val="' + (hb ? 'maxMin' : 'minMax') + '"/></c:scaling><c:delete val="0"/><c:axPos val="' + (hb ? 'l' : 'b') + '"/><c:numFmt formatCode="General" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="low"/><c:spPr><a:ln w="9525"><a:solidFill><a:srgbClr val="C3C2B7"/></a:solidFill></a:ln></c:spPr><c:crossAx val="5002"/><c:crosses val="autoZero"/><c:auto val="1"/><c:lblAlgn val="ctr"/><c:lblOffset val="100"/><c:noMultiLvlLbl val="0"/></c:catAx>'
    + '<c:valAx><c:axId val="5002"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:delete val="0"/><c:axPos val="' + (hb ? 'b' : 'l') + '"/><c:majorGridlines><c:spPr><a:ln w="6350"><a:solidFill><a:srgbClr val="E1E0D9"/></a:solidFill></a:ln></c:spPr></c:majorGridlines><c:numFmt formatCode="' + xe(fc) + '" sourceLinked="0"/><c:majorTickMark val="none"/><c:minorTickMark val="none"/><c:tickLblPos val="nextTo"/><c:spPr><a:ln><a:noFill/></a:ln></c:spPr><c:crossAx val="5001"/><c:crosses val="' + (hb ? 'max' : 'autoZero') + '"/><c:crossBetween val="between"/>' + (c.fmt === 'int' && Math.max.apply(null, c.series.reduce((a, s) => a.concat(s.values), [0])) <= 10 ? '<c:majorUnit val="1"/>' : '') + '</c:valAx>';
  let plot;
  if (c.kind === 'donut') plot = '<c:doughnutChart><c:varyColors val="1"/>' + sers + '<c:firstSliceAng val="0"/><c:holeSize val="58"/></c:doughnutChart>';
  else if (c.kind === 'line') plot = '<c:lineChart><c:grouping val="standard"/><c:varyColors val="0"/>' + sers + '<c:marker val="1"/><c:axId val="5001"/><c:axId val="5002"/></c:lineChart>' + axes;
  else plot = '<c:barChart><c:barDir val="' + (hb ? 'bar' : 'col') + '"/><c:grouping val="clustered"/><c:varyColors val="0"/>' + sers + '<c:gapWidth val="70"/><c:axId val="5001"/><c:axId val="5002"/></c:barChart>' + axes;
  const legend = c.kind === 'donut' || c.series.length > 1 ? '<c:legend><c:legendPos val="' + (c.kind === 'donut' ? 'r' : 'b') + '"/><c:overlay val="0"/></c:legend>' : '';
  return XML + '<c:chartSpace xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="' + NS_R + '"><c:roundedCorners val="0"/><c:chart>'
    + '<c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:pPr><a:defRPr sz="1200" b="1"/></a:pPr><a:r><a:rPr lang="' + (lang === 'ar' ? 'ar-EG' : 'en-US') + '" sz="1200" b="1"/><a:t>' + xe(c.title) + '</a:t></a:r></a:p></c:rich></c:tx><c:overlay val="0"/></c:title><c:autoTitleDeleted val="0"/>'
    + '<c:plotArea><c:layout/>' + plot + '</c:plotArea>' + legend + '<c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart>'
    + '<c:spPr><a:solidFill><a:srgbClr val="FFFFFF"/></a:solidFill><a:ln w="9525"><a:solidFill><a:srgbClr val="E1E0D9"/></a:solidFill></a:ln></c:spPr></c:chartSpace>';
}

/* ---- logo as PNG ---- */
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img')); i.src = src; });
async function logoPng() {
  try {
    const cv = document.createElement('canvas'); let ctx;
    if (brand.logo) {
      const im = await loadImg(brand.logo), sc = Math.min(1, 160 / im.naturalHeight);
      cv.width = Math.max(1, Math.round(im.naturalWidth * sc)); cv.height = Math.max(1, Math.round(im.naturalHeight * sc));
      ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(im, 0, 0, cv.width, cv.height);
    } else {
      const mark = await loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_MARK)), name = brandName();
      const m = cv.getContext('2d'); m.font = '800 54px "Segoe UI", system-ui, Arial, sans-serif';
      const tw = Math.ceil(m.measureText(name).width);
      cv.width = 8 + 96 + 22 + tw + 16; cv.height = 112;
      ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(mark, 8, 8, 96, 96); ctx.font = '800 54px "Segoe UI", system-ui, Arial, sans-serif'; ctx.fillStyle = '#0d366b'; ctx.textBaseline = 'middle'; ctx.fillText(name, 126, 58);
    }
    const blob = await new Promise((r) => cv.toBlob(r, 'image/png'));
    if (!blob) return null;
    return { bytes: new Uint8Array(await blob.arrayBuffer()), w: cv.width, h: cv.height };
  } catch (_) { return null; }
}

/* ---- workbook ---- */
async function buildXlsx(m) {
  const st = xlsxStyles(), rtl = m.lang === 'ar', sheets = [], used = new Set(), logo = await logoPng();
  const sheetName = (base) => {
    let n = String(base).replace(/[\\/?*[\]:]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 31) || 'Sheet', k = 2, cand = n;
    while (used.has(cand.toLowerCase())) { const suf = ' ' + k++; cand = n.slice(0, 31 - suf.length) + suf; }
    used.add(cand.toLowerCase()); return cand;
  };
  const S = { title: st.get({ font: 3 }), muted: st.get({ font: 4 }), bold: st.get({ font: 2 }), head: st.get({ font: 1, fill: 2, wrap: true, h: 'center' }), headN: st.get({ font: 1, fill: 2, wrap: true, h: 'center' }), kpiLabel: st.get({ font: 2, fill: 3, border: 1 }), note: st.get({ font: 4, border: 1, wrap: true }) };
  const width = (rows, header, i) => Math.min(60, Math.max(10, Math.ceil(Math.max(String(header).length, ...rows.map((r) => String(r[i] == null ? '' : typeof r[i] === 'number' ? nf(r[i], { maximumFractionDigits: 2 }) : r[i]).length)) * 1.12 + 3)));
  const fe = (x) => String(x).replace(/&/g, '&&');           // a literal & inside a header/footer must be doubled
  const footerText = '&L' + fe(brandName()) + '&C' + fe(m.title) + '&R&D';

  // ---- Summary
  const sum = new XSheet(sheetName(t('rp.sheet.summary'))); sum.grid = false; sum.widths = [34, 26, 30, 14, 14, 14]; sheets.push(sum);
  [0, 1, 2].forEach((r) => sum.heights.set(r, 20));
  sum.put(4, 0, m.title, S.title); sum.heights.set(4, 28); sum.merges.push('A5:F5');
  [[t('rp.scope'), m.scope], [t('rp.period'), m.period], [t('rp.generated'), fmtDateTime(m.generated.toISOString())]].forEach(([k, v], i) => { sum.put(5 + i, 0, k, S.bold); sum.put(5 + i, 1, v, 0); });
  let r = 9;
  if (m.empty) { sum.put(r, 0, t(m.type === 'bom' ? 'rp.emptyBom' : m.type === 'satisfaction' ? 'rp.emptySat' : 'rp.empty'), S.muted); r += 2; }
  if (m.kpis.length) {
    ['rp.sheet.metric', 'rp.sheet.value', 'rp.sheet.note'].forEach((k, i) => sum.put(r, i, t(k), S.head)); r++;
    for (const k of m.kpis) {
      const font = k.tone === 'neg' ? 6 : k.tone === 'pos' ? 7 : 5;
      sum.put(r, 0, k.label, S.kpiLabel); sum.put(r, 1, typeof k.v === 'number' && isFinite(k.v) ? k.v : '', st.get({ font, fill: 3, border: 1, fmt: KIND_FMT[k.kind] || 'gen', h: 'right' })); sum.put(r, 2, k.sub || '', S.note); r++;
    }
  }
  r++;
  const contact = [brand.phone, brand.email, brand.website, brand.address].filter(Boolean).join('  ·  '), foot = L(session.settings.reportFooter);
  if (contact) sum.put(r++, 0, contact, S.muted);
  if (foot) sum.put(r++, 0, foot, S.muted);
  sum.put(r++, 0, (m.private ? t('rp.confidential') + '  ·  ' : '') + brandName() + '  ·  ' + fmtDay(todayStr()), S.muted);

  // ---- Charts (data blocks + native charts)
  let chartSheet = null; const chartDefs = [];
  if (m.charts.length) {
    chartSheet = new XSheet(sheetName(t('rp.sheet.charts'))); chartSheet.widths = [30, 16, 16, 16, 4]; sheets.push(chartSheet);
    m.charts.forEach((c, i) => {
      const r0 = i * 20, n = c.cats.length, q = qSheet(chartSheet.name), first = r0 + 3;
      chartSheet.put(r0, 0, c.title, S.bold);
      chartSheet.put(r0 + 1, 0, t('rp.col.cat'), S.head);
      c.series.forEach((s, j) => chartSheet.put(r0 + 1, 1 + j, s.name, S.headN));
      c.cats.forEach((cat, k) => {
        chartSheet.put(r0 + 2 + k, 0, cat, st.get({ border: 1, fill: k % 2 ? 3 : 0 }));
        c.series.forEach((s, j) => chartSheet.put(r0 + 2 + k, 1 + j, s.values[k], st.get({ border: 1, fill: k % 2 ? 3 : 0, fmt: c.fmt === 'money' ? 'money' : c.fmt === 'pct' ? 'pct' : c.fmt === 'score' ? 'dec' : 'int' })));
      });
      const L1 = (col) => q + '!$' + col + '$' + first + ':$' + col + '$' + (first + n - 1);
      chartDefs.push({ c, r0, ref: { cat: L1('A'), name: c.series.map((_, j) => q + '!$' + colName(1 + j) + '$' + (r0 + 2)), val: c.series.map((_, j) => L1(colName(1 + j))) } });
    });
  }

  // ---- one sheet per table
  for (const tb of m.tables) {
    const sh = new XSheet(sheetName(tb.title)); sheets.push(sh);
    sh.put(0, 0, tb.title, S.title); sh.heights.set(0, 28); sh.put(1, 0, m.scope + '  ·  ' + m.period, S.muted);
    tb.cols.forEach((c, i) => sh.put(3, i, c.h, S.head)); sh.heights.set(3, 32);
    tb.rows.forEach((row, ri) => row.forEach((v, i) => {
      const c = tb.cols[i], z = ri % 2 ? 3 : 0;
      const val = c.kind === 'date' ? serialOf(v) : (c.kind === 'text' ? (v == null ? '' : String(v)) : (v === '' || v == null ? '' : Number(v)));

    const rels = [];
    const addDrawing = (inner, drels) => {
      const dn = ++nDraw;
      put('xl/drawings/drawing' + dn + '.xml', XML + '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="' + NS_R + '" xmlns:c="http://schemas.openxmlformats.org/drawingml/2006/chart">' + inner + '</xdr:wsDr>');

      sh.drawing = true; rels.push('<Relationship Id="rId1" Type="' + REL + 'drawing" Target="../drawings/drawing' + dn + '.xml"/>');
    };
    if (sh === sum && logo) {
      const dh = 52, dw = Math.round((logo.w * dh) / logo.h);
      addDrawing('<xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>38100</xdr:rowOff></xdr:from><xdr:ext cx="' + anchorEmu(dw) + '" cy="' + anchorEmu(dh) + '"/>'
        + '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="Logo" descr="' + xe(brandName()) + '"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'
        + '<xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + anchorEmu(dw) + '" cy="' + anchorEmu(dh) + '"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>',
        '<Relationship Id="rId1" Type="' + REL + 'image" Target="../media/logo.png"/>');
    }
    if (sh === chartSheet) {

      chartDefs.forEach((d, k) => {

        ct.push('<Override PartName="/xl/charts/chart' + cn + '.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>');
        drels += '<Relationship Id="rId' + (k + 1) + '" Type="' + REL + 'chart" Target="../charts/chart' + cn + '.xml"/>';
        inner += '<xdr:twoCellAnchor><xdr:from><xdr:col>5</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>' + d.r0 + '</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>15</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>' + (d.r0 + 18) + '</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to>'

  put('xl/_rels/workbook.xml.rels', XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + sheets.map((_, i) => '<Relationship Id="rId' + (i + 1) + '" Type="' + REL + 'worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') + '<Relationship Id="rId' + (sheets.length + 1) + '" Type="' + REL + 'styles" Target="styles.xml"/></Relationships>');
  put('docProps/core.xml', XML + '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>' + xe(m.title) + '</dc:title><dc:creator>' + xe(brandName()) + '</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">' + m.generated.toISOString().replace(/\.\d+Z$/, 'Z') + '</dcterms:created></cp:coreProperties>');
  put('_rels/.rels', XML + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="' + REL + 'officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>');
  put('[Content_Types].xml', XML + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' + ct.join('') + '</Types>');
  // [Content_Types].xml first, as Office writes it
  files.unshift(files.pop());
  return zipStore(files);
}

/* =====================================================================
   Client ratings: import the encrypted codes clients send back, show them
   ===================================================================== */
const FB_FIND = /DSFB1\.[A-Za-z0-9_-]{3,40}\.[A-Za-z0-9_-]+/g;

function allRatings() {
  const out = [];
  for (const it of store.items) for (const p of it.rec.projects) if (p.feedback && num(p.feedback.score) > 0) out.push({ rec: it.rec, p, fb: p.feedback });
  return out.sort((a, b) => String(b.fb.at).localeCompare(String(a.fb.at)));
}
const avgScore = (list) => (list.length ? sum(list, (x) => x.fb.score) / list.length : null);
const scoreBar = (n) => h('div', { class: 'scorebar', role: 'img', 'aria-label': t('fb.outOf', { n: nf(n) }) }, Array.from({ length: 10 }, (_, i) => h('i', { class: i < n ? 'on' : '' })));

// Returns { out: [{kind, text}], changed }. Every code is verified with the secret key of the client it names.
async function importFeedback(text) {
  const codes = [...new Set(String(text || '').match(FB_FIND) || [])];
  const out = [], touched = new Map();
  if (!codes.length) return { out: [{ kind: 'bad', text: t('fb.none') }], changed: 0 };
  for (const code of codes) {
    const id = code.split('.')[1];
    const it = store.items.find((x) => x.rec.id === id);
    if (!it) { out.push({ kind: 'bad', text: t('fb.unknownClient', { id }) }); continue; }
    const o = await readFeedbackCode(code, it.rec.secret);
    if (!o) { out.push({ kind: 'bad', text: t('fb.unreadable', { id }) }); continue; }
    const p = it.rec.projects.find((x) => x.sku === o.sku);
    if (!p) { out.push({ kind: 'bad', text: t('fb.unknownProject', { id, sku: String(o.sku || '') }) }); continue; }
    const d = new Date(o.at), at = isNaN(d) ? new Date().toISOString() : d.toISOString();
    if (p.feedback && String(p.feedback.at || '') >= at) { out.push({ kind: 'warn', text: t('fb.older', { sku: p.sku }) }); continue; }
    p.feedback = { score: o.score, comment: String(o.comment || '').slice(0, 600), at };
    touched.set(id, it); out.push({ kind: 'ok', text: t('fb.imported', { sku: p.sku, id, n: nf(o.score) }) });
  }
  let changed = 0;
  for (const [id, it] of touched) {
    try {
      it.rec.updatedAt = new Date().toISOString();
      it.sha = await savePrivate(it.rec, it.sha);
      await publishClient(it.rec); changed++;
      if (ed && ed.id === id && !ed.dirty) ed = null;       // the open editor would hold an older copy
    } catch (e) { out.push({ kind: 'bad', text: t('fb.saveFail', { id, m: e.message }) }); }
  }
  return { out, changed };
}

function ratingsCard() {
  const box = h('textarea', { id: 'fbIn', rows: 4, dir: 'ltr', spellcheck: 'false', placeholder: t('fb.placeholder'), 'aria-label': t('fb.import') });
  const res = h('div', { class: 'stack-sm', id: 'fbRes' }), sumBox = h('div', { class: 'stack-sm' });
  const draw = () => {
    const rs = allRatings(), avg = avgScore(rs);
    sumBox.replaceChildren(rs.length
      ? h('div', { class: 'stack-sm' },
        kpis(kpi(t('fb.avg'), nf(avg, { maximumFractionDigits: 1 }) + ' / 10', avg >= 8 ? 'pos' : avg >= 5 ? '' : 'neg', t('fb.count', { n: nf(rs.length) }))),
        h('strong', { class: 'small' }, t('fb.latest')),
        ...rs.slice(0, 5).map((x) => h('div', { class: 'fbitem' },
          h('div', { class: 'rowsep' }, h('span', {}, h('strong', { class: 'mono' }, x.p.sku), ' ', h('span', { dir: 'auto', class: 'muted' }, x.rec.client.name)), h('strong', {}, nf(x.fb.score) + '/10')),
          scoreBar(x.fb.score),
          x.fb.comment ? h('p', { class: 'fbquote', dir: 'auto' }, x.fb.comment) : h('p', { class: 'small muted' }, t('fb.noComment')),
          h('span', { class: 'small muted' }, t('fb.onDate', { d: fmtDateTime(x.fb.at) })))))
      : h('p', { class: 'empty' }, t('fb.noRatings')));
  };
  draw();
  const go = h('button', { class: 'btn primary', type: 'button', id: 'btnFbImport', onclick: async () => {
    go.disabled = true; res.replaceChildren(h('p', { class: 'msg' }, t('fb.working')));
    try {
      const r = await importFeedback(box.value);
      res.replaceChildren(...r.out.map((o) => h('p', { class: 'msg ' + o.kind, role: o.kind === 'bad' ? 'alert' : 'status' }, o.text)));
      if (r.changed) { box.value = ''; draw(); }
    } catch (e) { res.replaceChildren(h('p', { class: 'msg bad', role: 'alert' }, e.message)); } finally { go.disabled = false; }
  } }, t('fb.importBtn'));
  return h('section', { class: 'card stack-sm' },
    h('div', { class: 'card-head' }, h('h2', {}, t('fb.title')), h('a', { class: 'btn small', href: '#reports', id: 'btnRatingsReport', onclick: () => { reportSel = { type: 'satisfaction', client: '', project: '', from: '', to: '' }; } }, t('fb.report'))),
    sumBox,
    h('details', { class: 'fbimport' }, h('summary', {}, t('fb.import')),
      h('div', { class: 'stack-sm' }, h('p', { class: 'hint' }, t('fb.importHint')), box, h('div', { class: 'actions' }, go), res)));
}

// Shown in the project editor (read only: the rating is the client's own words)
function feedbackBlock(p) {
  const done = projState(p) === 'completed';
  if (!p.feedback) return done ? h('p', { class: 'notice' }, t('fb.waiting')) : null;
  return h('div', { class: 'fbitem' }, h('div', { class: 'rowsep' }, h('strong', {}, t('fb.rated')), h('strong', {}, nf(p.feedback.score) + '/10')), scoreBar(p.feedback.score),
    p.feedback.comment ? h('p', { class: 'fbquote', dir: 'auto' }, p.feedback.comment) : h('p', { class: 'small muted' }, t('fb.noComment')),
    h('span', { class: 'small muted' }, t('fb.onDate', { d: fmtDateTime(p.feedback.at) })));
}

/* =====================================================================
   Routing (admin site)
   ===================================================================== */
const editorHash = () => (ed ? (ed.isNew ? '#new' : '#manage/' + ed.id) : '');

async function route(opts = {}) {
  const token = ++routeToken, hash = location.hash;
  if (ed && ed.dirty && !opts.keep && hash !== editorHash()) {
    if (!confirm(t('ed.discardConfirm'))) { location.replace(editorHash()); return; }
    ed = null;
  }
  syncTools(); applyStatic();
  document.title = brandName() + ' — ' + t('app.adminTag');
  const nav = $('#adminNav'), cfg = loadCfg();
  if (!cfg) { // first run: nothing to protect yet, go straight to setup
    nav.hidden = true;
    if (hash !== '#config') { location.replace('#config'); return; }
    return renderConfig();
  }
  if (!session) { nav.hidden = true; return renderLocked(); }

  nav.hidden = false; armIdle();
  const view = hash === '#config' ? 'config' : hash === '#settings' ? 'settings' : hash === '#reports' ? 'reports' : 'dashboard';
  nav.querySelectorAll('a').forEach((a) => { if (a.dataset.route === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const m = hash.match(/^#manage\/([\w-]+)$/);
  if (view === 'config') return renderConfig();
  if (view === 'settings') return renderSettings(token, !!opts.keep);
  if (view === 'reports') return renderReports(token, !!opts.keep);
  if (hash === '#new') return openNew(token);
  if (m) return openEditor(m[1], token);
  return renderDashboard(token, !!opts.keep);
}
/* =====================================================================
   Boot
   ===================================================================== */
function fatal(title, text) { mount(notice(title, text, 'bad')); }

async function boot() {
  if (window.__dsp) window.__dsp.booted = true;          // the script is alive (stops the start-up safety net)
  hydrate(document.querySelector('header'));
  applyBrand(); applyStatic(); syncTools();
  $('#btnLang').onclick = () => setLang(lang === 'ar' ? 'en' : 'ar');
  $('#btnTheme').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  $('#btnLock').onclick = () => lock(false);
  if (!window.CryptoJS && window.__dsp && window.__dsp.crypto) {
    mount(notice(t('boot.loadingLib'), t('boot.loadingLibText'), '', { spinner: true }));
    await window.__dsp.crypto;
  }
  if (!window.CryptoJS) return fatal(t('boot.noLib'), t('boot.noLibText'));
  if (!(window.crypto && crypto.subtle)) return fatal(t('boot.noSecure'), t('boot.noSecureText'));
  addEventListener('hashchange', () => route());
  addEventListener('beforeunload', (e) => { if (ed && ed.dirty) { e.preventDefault(); e.returnValue = ''; } });
  route();
}
boot().catch((e) => { try { fatal('Error', String((e && e.message) || e)); } catch (_) { /* the start-up safety net shows the details */ } });
})();
</script>
