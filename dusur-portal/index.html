<!DOCTYPE html>
<!--
  DUSUR - CLIENT site (public entry point of the portal).
  Clients open  https://<username>.github.io/<repo>/  to search for their project, or the private link copied from the admin dashboard
  (.../#client/<id>). Everything is decrypted in the browser with the client's secret key.
  This page and the files it loads contain no admin code, no token and no repository details: the repository is worked out from the page address.
  Structure and set-up: see README.md and docs/ARCHITECTURE.md.
-->
